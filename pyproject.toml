[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-radar-mcp"
version = "0.2.0"
description = "Stateful, concurrent intel scanning over MCP (the engine behind the trend-radar skill)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ngwddd" }]
keywords = ["mcp", "intel", "rss", "research", "trend-radar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
trend-radar-mcp = "trend_radar_mcp.server:main"

[tool.setuptools.packages.find]
include = ["trend_radar_mcp*"]
